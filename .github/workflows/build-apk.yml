name: Build Chérie Lexicon APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web app
        run: |
          bun install
          bun run build

      - name: Configure, add, and sync Capacitor Android
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.kathyacinth.cherielexicon",
            "appName": "Chérie Lexicon",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          bunx cap add android
          bunx cap sync android

      - name: Compile APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cherie-Lexicon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
